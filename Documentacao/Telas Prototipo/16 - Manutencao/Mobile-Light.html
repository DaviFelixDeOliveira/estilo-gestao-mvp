<div class="flex items-center gap-space-2xs mb-space-lg">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">content_cut</span>
<span class="font-headline-sm text-headline-sm text-primary tracking-tight font-semibold">Estilo &amp; Gestão</span>
</div>
<!-- Central Maintenance Card -->
<div class="w-full bg-surface-elevated rounded-xl shadow-sm p-space-lg flex flex-col items-center">
<!-- Maintenance Icon with Animated Pulsing Ambient Glow -->
<div class="relative flex items-center justify-center mb-space-md">
<div class="absolute inset-0 rounded-full bg-surface-container-high animate-ping opacity-25"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-text-primary text-[32px]">build</span>
</div>
</div>
<!-- Title & Support Message -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary mb-space-xs tracking-tight">
      Estamos em manutenção
    </h1>
<p class="font-body-md text-body-md text-text-secondary mb-space-lg px-space-xs leading-relaxed">
      Estamos realizando melhorias no Estilo e Gestão.
    </p>
<!-- Operational Detail Block -->
<div class="w-full bg-surface-base rounded-lg p-space-md mb-space-lg text-left">
<div class="flex flex-col gap-space-sm">
<!-- Motivo -->
<div class="flex items-start justify-between gap-space-xs">
<span class="font-label-md text-label-md text-text-secondary uppercase tracking-wider">Motivo</span>
<span class="font-label-lg text-label-lg text-text-primary text-right font-medium">Melhorias no sistema</span>
</div>
<div class="w-full h-px bg-surface-container-high"></div>
<!-- Previsão de Retorno -->
<div class="flex items-start justify-between gap-space-xs">
<span class="font-label-md text-label-md text-text-secondary uppercase tracking-wider">Previsão de retorno</span>
<div class="flex items-center gap-space-2xs">
<span class="material-symbols-outlined text-success text-[16px]">schedule</span>
<span class="font-label-lg text-label-lg text-text-primary text-right font-medium">Hoje, às 22:00</span>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full min-h-[44px] h-[48px] bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-xs transition-all duration-150 active:scale-[0.98] shadow-sm select-none" id="retry-btn" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="retry-icon">refresh</span>
<span id="retry-label">Tentar novamente</span>
</button>
</div>
<!-- Subdued Footer Note -->
<p class="font-body-sm text-body-sm text-text-secondary mt-space-lg tracking-normal">
    Agradecemos a compreensão e o apoio de sempre.
  </p>
</div>
<script>
  const retryBtn = document.getElementById('retry-btn');
  const retryIcon = document.getElementById('retry-icon');
  const retryLabel = document.getElementById('retry-label');

  if (retryBtn && retryIcon && retryLabel) {
    retryBtn.addEventListener('click', () => {
      retryIcon.classList.add('rotate-180');
      retryLabel.textContent = 'Verificando...';
      retryBtn.disabled = true;
      retryBtn.classList.add('opacity-75');

      setTimeout(() => {
        retryIcon.classList.remove('rotate-180');
        retryLabel.textContent = 'Tentar novamente';
        retryBtn.disabled = false;
        retryBtn.classList.remove('opacity-75');
      }, 1000);
    });
  }
