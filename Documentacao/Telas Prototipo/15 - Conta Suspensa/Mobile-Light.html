<div class="w-full max-w-sm flex flex-col items-center">
<!-- Top System Branding -->
<div class="flex items-center gap-space-xs mb-space-lg">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">content_cut</span>
<span class="font-headline-sm text-headline-sm text-text-primary tracking-tight">Estilo &amp; Gestão</span>
</div>
<!-- Main Isolation Card -->
<div class="w-full bg-surface-elevated rounded-xl shadow-sm p-space-lg flex flex-col items-center text-center">
<!-- Shop Context & Status Badge -->
<div class="w-full flex flex-col items-center gap-space-2xs pb-space-md">
<span class="font-body-sm text-body-sm text-text-secondary">Barbearia Navalha &amp; Fio</span>
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-warning-surface text-warning font-label-sm text-label-sm">
          Conta suspensa
        </span>
</div>
<!-- Tactical Warm Shield Icon -->
<div class="my-space-md relative flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-text-primary">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
<!-- Core Status Messaging -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary mb-space-xs">
        Sua conta está suspensa.
      </h1>
<p class="font-body-md text-body-md text-text-primary mb-space-xs">
        O acesso ao Estilo e Gestão foi temporariamente bloqueado.
      </p>
<p class="font-body-sm text-body-sm text-text-secondary mb-space-lg max-w-xs">
        Se acredita que isso aconteceu por engano, entre em contato com o suporte.
      </p>
<!-- Action Buttons conforming to 44px touch mandate -->
<div class="w-full flex flex-col gap-space-xs pt-space-xs">
<button class="w-full min-h-[44px] h-11 px-5 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-sm hover:bg-interactive-hover active:opacity-90 transition-colors" type="button">
<span class="material-symbols-outlined text-lg">support_agent</span>
<span>Entrar em contato com o suporte</span>
</button>
<button class="w-full min-h-[44px] h-11 px-5 rounded-xl bg-surface-base text-text-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs hover:bg-surface-secondary active:opacity-90 transition-colors" type="button">
<span class="material-symbols-outlined text-lg text-secondary">logout</span>
<span>Sair da conta</span>
</button>
</div>
</div>
<!-- Security Footnote -->
<div class="mt-space-lg flex items-center justify-center gap-space-2xs text-text-secondary">
<span class="material-symbols-outlined text-sm">lock</span>
<span class="font-helper-text text-helper-text">Ambiente seguro e monitorado</span>
</div>
</div>
</div></main></body></html>
