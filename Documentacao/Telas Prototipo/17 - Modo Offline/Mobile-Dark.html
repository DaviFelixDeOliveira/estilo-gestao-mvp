<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#faf9f5;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'tertiary-fixed': '#e4e2dd', 'outline-variant': '#c7c7c0', 'warning-surface': '#FFF4E5', 'surface': '#faf9f5', 'dark-surface-secondary': '#2B2B29', 'on-primary': '#ffffff', 'primary-fixed': '#e5e2df', 'surface-container-low': '#f4f4f0', 'on-secondary-fixed-variant': '#474745', 'dark-primary': '#F4F4F0', 'danger': '#B42318', 'info': '#175CD3', 'surface-tint': '#5f5e5c', 'surface-dim': '#dadad6', 'dark-text-secondary': '#B8B8B2', 'surface-base': '#F4F4F0', 'primary-fixed-dim': '#c8c6c3', 'inverse-surface': '#2f312e', 'on-primary-container': '#989693', 'inverse-primary': '#c8c6c3', 'surface-container-highest': '#e2e3df', 'surface-bright': '#faf9f5', 'on-background': '#1a1c1a', 'dark-info-surface': '#12365A', 'tertiary-container': '#2f2f2c', 'primary-container': '#2f2f2d', 'on-surface': '#1a1c1a', 'on-secondary-container': '#656462', 'error': '#ba1a1a', 'dark-warning': '#FDB022', 'surface-secondary': '#E9E9E4', 'on-tertiary-fixed-variant': '#474743', 'text-primary': '#2F2F2D', 'border-subtle': '#E9E9E4', 'secondary-fixed-dim': '#c8c6c3', 'dark-danger-surface': '#4A1D1A', 'secondary-container': '#e4e2df', 'error-container': '#ffdad6', 'warning': '#B54708', 'on-tertiary-container': '#979792', 'on-secondary-fixed': '#1b1c1a', 'success': '#2F6B4F', 'secondary-fixed': '#e4e2df', 'dark-success': '#6FB892', 'tertiary-fixed-dim': '#c8c6c1', 'danger-surface': '#FEECEB', 'background': '#faf9f5', 'secondary': '#5f5e5c', 'surface-variant': '#e2e3df', 'surface-container': '#eeeeea', 'dark-danger': '#F97066', 'on-error-container': '#93000a', 'on-primary-fixed-variant': '#474745', 'on-secondary': '#ffffff', 'on-surface-variant': '#464742', 'dark-border': '#3F3F3B', 'dark-success-surface': '#173B2D', 'dark-bg': '#181817', 'on-primary-fixed': '#1b1c1a', 'surface-container-high': '#e8e8e4', 'text-secondary': '#666662', 'success-surface': '#EAF5EF', 'on-error': '#ffffff', 'dark-text-primary': '#F4F4F0', 'surface-elevated': '#FFFFFF', 'dark-info': '#53B1FD', 'on-tertiary': '#ffffff', 'dark-primary-hover': '#E9E9E4', 'interactive-hover': '#3A3A38', 'dark-warning-surface': '#4A2C0A', 'info-surface': '#EAF3FF', 'outline': '#777871', 'tertiary': '#1a1a18', 'on-tertiary-fixed': '#1b1c19', 'dark-surface': '#222220', 'inverse-on-surface': '#f1f1ed', 'surface-container-lowest': '#ffffff', 'primary': '#1a1a19' }, borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' }, spacing: { 'gutter-desktop': '1.5rem', 'space-lg': '1.5rem', 'space-sm': '0.75rem', 'margin-tablet': '1.5rem', 'margin-desktop': '2rem', 'space-xl': '2rem', 'margin': '1rem', 'space-xs': '0.5rem', 'gutter': '1rem', 'space-2xs': '0.25rem', 'space-md': '1rem', 'space-2xl': '3rem' }, fontFamily: { 'body-sm': ['Plus Jakarta Sans'], 'headline-sm': ['Plus Jakarta Sans'], 'headline-xl-mobile': ['Plus Jakarta Sans'], 'headline-lg-mobile': ['Plus Jakarta Sans'], 'label-sm': ['Plus Jakarta Sans'], 'helper-text': ['Plus Jakarta Sans'], 'body-md': ['Plus Jakarta Sans'], 'headline-md': ['Plus Jakarta Sans'], 'body-lg': ['Plus Jakarta Sans'], 'metric-display': ['Plus Jakarta Sans'], 'headline-xl': ['Plus Jakarta Sans'], 'label-md': ['Plus Jakarta Sans'], 'label-lg': ['Plus Jakarta Sans'], 'headline-lg': ['Plus Jakarta Sans'] }, fontSize: { 'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }], 'headline-sm': ['16px', { lineHeight: '24px', letterSpacing: '-0.005em', fontWeight: '600' }], 'headline-xl-mobile': ['28px', { lineHeight: '34px', letterSpacing: '-0.015em', fontWeight: '700' }], 'headline-lg-mobile': ['24px', { lineHeight: '30px', letterSpacing: '-0.01em', fontWeight: '600' }], 'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.03em', fontWeight: '600' }], 'helper-text': ['12px', { lineHeight: '16px', fontWeight: '400' }], 'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }], 'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }], 'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'metric-display': ['32px', { lineHeight: '38px', letterSpacing: '-0.02em', fontWeight: '700' }], 'headline-xl': ['36px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '700' }], 'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' }], 'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }], 'headline-lg': ['28px', { lineHeight: '36px', letterSpacing: '-0.015em', fontWeight: '600' }] } } } };</script></head><body class="bg-surface text-text-primary min-h-screen flex flex-col pt-safe pb-safe selection:bg-surface-secondary"><main class="flex-1 flex flex-col justify-center items-center w-full min-h-full px-margin bg-surface"><div class="flex flex-col w-full max-w-[390px] mx-auto py-space-xl px-space-xs text-center justify-between min-h-[580px]">
<!-- Top Brand Mark -->
<header class="flex flex-col items-center justify-center space-y-space-2xs select-none">
<div class="flex items-center space-x-space-xs">
<div class="w-7 h-7 rounded-lg bg-dark-surface-secondary flex items-center justify-center text-dark-primary shadow-sm">
<span class="material-symbols-outlined text-[18px]">content_cut</span>
</div>
<span class="font-headline-sm text-headline-sm text-dark-primary tracking-tight">Estilo &amp; Gestão</span>
</div>
<span class="font-label-sm text-label-sm text-dark-text-secondary uppercase tracking-wider">Sistema Operacional</span>
</header>
<!-- Central Card with Offline State -->
<main class="w-full my-auto py-space-md">
<div class="w-full bg-dark-surface rounded-2xl p-space-lg flex flex-col items-center shadow-lg relative overflow-hidden">
<!-- Decorative Warm Ambient Pulse -->
<div class="absolute -top-12 -right-12 w-28 h-28 bg-dark-border/20 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-24 h-24 bg-dark-border/15 rounded-full blur-xl pointer-events-none"></div>
<!-- Tactile Network Offline Icon Badge -->
<div class="relative w-20 h-20 rounded-full bg-dark-surface-secondary flex items-center justify-center mb-space-md shadow-inner">
<span class="material-symbols-outlined text-[36px] text-dark-primary transition-transform duration-300" id="offline-icon">wifi_off</span>
<!-- Subtle offline ping ring -->
<span class="absolute inset-0 rounded-full bg-dark-border/30 animate-ping opacity-25 pointer-events-none"></span>
</div>
<!-- Offline Title & Copy -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-dark-primary tracking-tight mb-space-xs">
        Sem conexão com a internet
      </h1>
<p class="font-body-md text-body-md text-dark-text-secondary max-w-[270px] mb-space-lg leading-relaxed">
        Verifique sua conexão e tente novamente.
      </p>
<!-- Primary Action CTA -->
<button class="w-full h-[48px] min-h-[44px] bg-dark-primary hover:bg-dark-primary-hover active:scale-[0.98] text-dark-bg font-label-lg text-label-lg rounded-xl flex items-center justify-center space-x-space-xs transition-all duration-150 select-none shadow-sm focus:outline-none" id="retry-btn" onclick="checkConnectionState()" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-700" id="retry-icon">refresh</span>
<span id="retry-text">Tentar novamente</span>
</button>
<!-- Operational Assurance Note -->
<div class="mt-space-md pt-space-xs flex items-center justify-center space-x-space-2xs text-[#8E8E88]">
<span class="material-symbols-outlined text-[15px] shrink-0">history</span>
<p class="font-body-sm text-body-sm leading-tight text-center">
          Quando a conexão for restabelecida, você poderá continuar de onde parou.
        </p>
</div>
</div>
</main>
<!-- Discrete Operational Footer -->
<footer class="pt-space-xs pb-space-2xs">
<p class="font-label-sm text-label-sm text-[#8E8E88] text-center tracking-normal">
      Estilo &amp; Gestão • Tecnologia para Barbearias
    </p>
</footer>
</div>
<script>
  function checkConnectionState() {
    const btn = document.getElementById('retry-btn');
    const btnText = document.getElementById('retry-text');
    const retryIcon = document.getElementById('retry-icon');
    const offlineIcon = document.getElementById('offline-icon');

    if (!btn || btn.disabled) return;

    // Disabled state
    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    btnText.textContent = 'Verificando conexão...';
    retryIcon.classList.add('animate-spin');
    offlineIcon.classList.add('scale-90');

    // Simulate reliable network polling probe
    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      btnText.textContent = 'Tentar novamente';
      retryIcon.classList.remove('animate-spin');
      offlineIcon.classList.remove('scale-90');
    }, 1800);
  }
</script></main></body></html>
