ight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"metric-display":["32px",{"lineHeight":"38px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-xl":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-lg":["28px",{"lineHeight":"36px","letterSpacing":"-0.015em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen"><main class="min-h-screen w-full flex items-center justify-center p-margin md:p-margin-tablet lg:p-margin-desktop bg-surface"><div class="flex flex-col w-full items-center justify-center min-h-[85vh] py-space-xl px-margin">
<!-- Subtle decorative ambient elements -->
<div class="relative w-full max-w-[480px] flex flex-col items-center">
<!-- Brand Header -->
<header class="flex items-center gap-space-xs mb-space-xl select-none">
<div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[22px]">content_cut</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-text-primary tracking-tight font-bold">Estilo &amp; Gestão</span>
<span class="font-label-sm text-label-sm text-text-secondary tracking-widest uppercase">Operação &amp; PDV</span>
</div>
</header>
<!-- Central Dedicated Card -->
<div class="w-full bg-surface-elevated rounded-xl p-space-xl sm:p-space-2xl shadow-xl flex flex-col items-center text-center relative overflow-hidden transition-all duration-300">
<!-- Gentle ambient halo behind icon -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-48 bg-surface-container rounded-full blur-2xl pointer-events-none opacity-60"></div>
<!-- Tactile Calming Disconnect Illustration / Icon Unit -->
<div class="relative mb-space-lg">
<div class="w-20 h-20 rounded-full bg-surface-container-low flex items-center justify-center text-secondary transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-[36px] text-text-secondary">wifi_off</span>
</div>
<!-- Discreet connection state badge -->
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-surface-elevated shadow-sm flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-outline-variant animate-pulse"></span>
</div>
</div>
<!-- Semantic Typography Hierarchy -->
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-space-xs tracking-tight">
        Sem conexão com a internet
      </h1>
<p class="font-body-lg text-body-lg text-text-secondary max-w-sm mb-space-xl leading-relaxed">
        Verifique sua conexão e tente novamente.
      </p>
<!-- Primary Action CTA -->
<div class="w-full flex flex-col items-center gap-space-md">
<button class="w-full sm:w-auto min-w-[220px] h-[48px] px-space-lg rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs hover:bg-interactive-hover active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-info focus:ring-offset-2 cursor-pointer shadow-sm disabled:opacity-60 disabled:cursor-wait" id="retry-button" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="button-icon">refresh</span>
<span id="button-label">Tentar novamente</span>
</button>
<!-- Dynamic Feedback Pill (Hidden initially) -->
<div class="opacity-0 translate-y-1 transition-all duration-200 pointer-events-none h-6 flex items-center justify-center" id="status-pill">
<span class="font-label-sm text-label-sm text-text-secondary px-space-sm py-space-2xs rounded-full bg-surface-container">
            Aguardando sinal estável...
          </span>
</div>
</div>
<!-- Secondary Soft Guidance -->
<div class="mt-space-md pt-space-lg w-full flex items-center justify-center">
<p class="font-helper-text text-helper-text text-text-secondary text-center leading-normal max-w-xs">
          Quando a conexão for restabelecida, você poderá continuar de onde parou.
        </p>
</div>
</div>
<!-- Clean Utilitarian Footer -->
<footer class="mt-space-xl flex items-center justify-center text-center">
<p class="font-label-sm text-label-sm text-text-secondary tracking-wide">
        Estilo &amp; Gestão • Tecnologia para Barbearias
      </p>
</footer>
</div>
<script>
    (function() {
      const button = document.getElementById('retry-button');
      const icon = document.getElementById('button-icon');
      const label = document.getElementById('button-label');
      const statusPill = document.getElementById('status-pill');

      if (!button || !icon || !label) return;

      let isChecking = false;

      button.addEventListener('click', function() {
        if (isChecking) return;

        isChecking = true;
        button.disabled = true;
        
        // Visual feedback
        icon.classList.add('animate-spin');
        label.textContent = 'Verificando conexão...';
        
        if (statusPill) {
          statusPill.classList.remove('opacity-0', 'translate-y-1');
          statusPill.classList.add('opacity-100', 'translate-y-0');
        }

        // Simulating quick diagnostic check
        setTimeout(function() {
          isChecking = false;
          button.disabled = false;
          icon.classList.remove('animate-spin');
          label.textContent = 'Tentar novamente';

          if (statusPill) {
            statusPill.classList.remove('opacity-100', 'translate-y-0');
            statusPill.classList.add('opacity-0', 'translate-y-1');
          }
        }, 2200);
      });
    })();
  </script>
</div></main></body></html>
