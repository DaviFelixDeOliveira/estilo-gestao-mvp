urface-variant":"#464742","dark-border":"#3F3F3B","dark-success-surface":"#173B2D","dark-bg":"#181817","on-primary-fixed":"#1b1c1a","surface-container-high":"#e8e8e4","text-secondary":"#666662","success-surface":"#EAF5EF","on-error":"#ffffff","dark-text-primary":"#F4F4F0","surface-elevated":"#FFFFFF","dark-info":"#53B1FD","on-tertiary":"#ffffff","dark-primary-hover":"#E9E9E4","interactive-hover":"#3A3A38","dark-warning-surface":"#4A2C0A","info-surface":"#EAF3FF","outline":"#777871","tertiary":"#1a1a18","on-tertiary-fixed":"#1b1c19","dark-surface":"#222220","inverse-on-surface":"#f1f1ed","surface-container-lowest":"#ffffff","primary":"#1a1a19"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter-desktop":"1.5rem","space-lg":"1.5rem","space-sm":"0.75rem","margin-tablet":"1.5rem","margin-desktop":"2rem","space-xl":"2rem","margin":"1rem","space-xs":"0.5rem","gutter":"1rem","space-2xs":"0.25rem","space-md":"1rem","space-2xl":"3rem"},"fontFamily":{"body-sm":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"helper-text":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"metric-display":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"]},"fontSize":{"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"headline-sm":["16px",{"lineHeight":"24px","letterSpacing":"-0.005em","fontWeight":"600"}],"headline-xl-mobile":["28px",{"lineHeight":"34px","letterSpacing":"-0.015em","fontWeight":"700"}],"headline-lg-mobile":["24px",{"lineHeight":"30px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.03em","fontWeight":"600"}],"helper-text":["12px",{"lineHeight":"16px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"metric-display":["32px",{"lineHeight":"38px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-xl":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"headline-lg":["28px",{"lineHeight":"36px","letterSpacing":"-0.015em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen"><main class="min-h-screen w-full flex items-center justify-center p-margin md:p-margin-tablet lg:p-margin-desktop bg-surface"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)] p-gutter md:p-gutter-desktop relative overflow-hidden select-none">
<div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-surface-tint/5 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-surface-tint/5 blur-3xl pointer-events-none"></div>
<div class="w-full max-w-[480px] flex flex-col items-center z-10">
<div class="flex items-center gap-space-xs mb-space-xl opacity-90 transition-opacity hover:opacity-100">
<div class="w-8 h-8 rounded-lg bg-dark-surface-secondary flex items-center justify-center text-dark-text-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">content_cut</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm tracking-tight text-dark-text-primary">Estilo &amp; Gestão</span>
</div>
</div>
<div class="w-full bg-dark-surface rounded-xl p-space-xl md:p-space-2xl shadow-xl flex flex-col items-center text-center relative">
<div class="w-16 h-16 rounded-full bg-dark-surface-secondary flex items-center justify-center text-dark-text-secondary mb-space-lg transition-transform hover:scale-105 duration-200">
<span class="material-symbols-outlined text-[32px]">wifi_off</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-dark-text-primary font-bold tracking-tight mb-space-xs">
        Sem conexão com a internet
      </h1>
<p class="font-body-md text-body-md text-dark-text-secondary max-w-[340px] mb-space-xl leading-relaxed">
        Verifique sua conexão e tente novamente.
      </p>
<div class="w-full flex flex-col items-center">
<button class="w-full min-h-[48px] px-space-lg rounded-xl bg-dark-primary hover:bg-dark-primary-hover active:scale-[0.99] text-dark-bg font-label-lg text-label-lg font-semibold flex items-center justify-center gap-space-xs shadow-sm transition-all duration-150 cursor-pointer" id="retry-btn" onclick="triggerRetry()">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="retry-icon">refresh</span>
<span id="retry-label">Tentar novamente</span>
</button>
<p class="font-body-sm text-body-sm text-dark-text-secondary mt-space-lg max-w-[360px] leading-relaxed">
          Quando a conexão for restabelecida, você poderá continuar de onde parou.
        </p>
</div>
<div class="mt-space-lg flex items-center gap-space-xs text-dark-text-secondary font-label-sm text-label-sm opacity-60" id="status-indicator">
<span class="w-2 h-2 rounded-full bg-dark-text-secondary" id="ping-dot"></span>
<span id="status-text">Aguardando rede...</span>
</div>
</div>
<footer class="mt-space-2xl text-center">
<p class="font-label-sm text-label-sm text-dark-text-secondary opacity-50 tracking-wide">
        Estilo &amp; Gestão • Tecnologia para Barbearias
      </p>
</footer>
</div>
</div>
<script>
  let isChecking = false;

  function triggerRetry() {
    if (isChecking) return;
    
    isChecking = true;
    const btn = document.getElementById('retry-btn');
    const icon = document.getElementById('retry-icon');
    const label = document.getElementById('retry-label');
    const pingDot = document.getElementById('ping-dot');
    const statusText = document.getElementById('status-text');

    btn.classList.add('opacity-80', 'cursor-wait');
    icon.classList.add('animate-spin');
    label.textContent = 'Verificando conexão...';
    pingDot.classList.remove('bg-dark-text-secondary');
    pingDot.classList.add('bg-dark-warning', 'animate-pulse');
    statusText.textContent = 'Testando sinal...';

    setTimeout(() => {
      if (navigator.onLine) {
        label.textContent = 'Conectado! Atualizando...';
        pingDot.classList.remove('bg-dark-warning', 'animate-pulse');
        pingDot.classList.add('bg-dark-success');
        statusText.textContent = 'Rede restabelecida';
        setTimeout(() => {
          window.location.reload();
        }, 600);
      } else {
        icon.classList.remove('animate-spin');
        btn.classList.remove('opacity-80', 'cursor-wait');
        label.textContent = 'Tentar novamente';
        pingDot.classList.remove('bg-dark-warning', 'animate-pulse', 'bg-dark-success');
        pingDot.classList.add('bg-dark-text-secondary');
        statusText.textContent = 'Sem sinal detectado';
        isChecking = false;
      }
    }, 1800);
  }

  window.addEventListener('online', () => {
    const pingDot = document.getElementById('ping-dot');
    const statusText = document.getElementById('status-text');
    if (pingDot && statusText) {
      pingDot.classList.remove('bg-dark-text-secondary', 'bg-dark-warning');
      pingDot.classList.add('bg-dark-success');
      statusText.textContent = 'Conexão detectada';
    }
  });

  window.addEventListener('offline', () => {
    const pingDot = document.getElementById('ping-dot');
    const statusText = document.getElementById('status-text');
    if (pingDot && statusText) {
      pingDot.classList.remove('bg-dark-success', 'bg-dark-warning');
      pingDot.classList.add('bg-dark-text-secondary');
      statusText.textContent = 'Aguardando rede...';
    }
  });
</script></main></body></html>
