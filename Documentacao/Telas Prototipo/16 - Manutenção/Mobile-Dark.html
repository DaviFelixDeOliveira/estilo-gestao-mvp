  };</script></head><body class="bg-surface text-text-primary antialiased min-h-screen flex flex-col justify-center items-center"><main class="flex-1 w-full flex flex-col justify-center items-center px-margin pt-safe pb-safe bg-surface"><div class="flex flex-col w-full max-w-[390px] mx-auto items-center justify-between min-h-[580px] py-space-md text-center select-none">
<!-- Top Branding -->
<header class="flex flex-col items-center justify-center gap-space-2xs pt-space-xs">
<div class="flex items-center gap-space-xs text-dark-text-secondary">
<span class="material-symbols-outlined text-[18px]">content_cut</span>
<span class="font-label-md text-label-md tracking-wider uppercase">Estilo &amp; Gestão</span>
</div>
</header>
<!-- Central Maintenance Card & Hero Illustration -->
<main class="w-full flex flex-col items-center my-auto px-space-xs">
<!-- Tactile Icon Shield Container -->
<div class="relative flex items-center justify-center mb-space-lg">
<div class="absolute w-20 h-20 rounded-full bg-dark-surface-secondary opacity-60 animate-pulse"></div>
<div class="relative w-16 h-16 rounded-xl bg-dark-surface flex items-center justify-center text-dark-primary shadow-md">
<span class="material-symbols-outlined text-[32px] text-dark-text-primary" style="font-variation-settings: 'FILL' 1;">construction</span>
</div>
<!-- Subtle Status Indicator Dot -->
<span class="absolute bottom-0 right-0 flex h-3.5 w-3.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-dark-warning opacity-75"></span>
<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-dark-warning"></span>
</span>
</div>
<!-- Headers -->
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-dark-text-primary tracking-tight mb-space-xs">
      Estamos em manutenção
    </h1>
<p class="font-body-md text-body-md text-dark-text-secondary max-w-[310px] mb-space-lg leading-relaxed">
      Estamos realizando melhorias no Estilo e Gestão.
    </p>
<!-- Operational Context Card -->
<div class="w-full bg-dark-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-sm text-left">
<!-- Row: Motivo -->
<div class="flex items-center justify-between pb-space-xs">
<div class="flex items-center gap-space-xs text-dark-text-secondary">
<span class="material-symbols-outlined text-[18px]">tune</span>
<span class="font-label-md text-label-md">Motivo</span>
</div>
<span class="font-label-md text-label-md text-dark-text-primary">
          Melhorias no sistema
        </span>
</div>
<!-- Subtle Internal Divider -->
<div class="h-[1px] w-full bg-dark-surface-secondary"></div>
<!-- Row: Previsão de retorno -->
<div class="flex items-center justify-between pt-space-2xs">
<div class="flex items-center gap-space-xs text-dark-text-secondary">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="font-label-md text-label-md">Previsão de retorno</span>
</div>
<span class="font-label-md text-label-md text-dark-text-primary tabular-nums">
          Hoje, às 22:00
        </span>
</div>
</div>
</main>
<!-- Bottom Actions & Feedback -->
<footer class="w-full flex flex-col items-center gap-space-md px-space-xs pb-space-xs">
<!-- Primary Touch Action Button (min 44px height) -->
<button class="w-full min-h-[44px] h-[48px] rounded-xl bg-dark-primary text-dark-bg font-label-lg text-label-lg active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs cursor-pointer select-none" id="retry-btn" onclick="handleRetry()" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="retry-icon">refresh</span>
<span id="retry-label">Tentar novamente</span>
</button>
<!-- Footnote -->
<p class="font-body-sm text-body-sm text-dark-text-secondary text-center">
      Agradecemos a paciência. Voltamos em instantes com novidades.
    </p>
</footer>
</div>
<script>
  function handleRetry() {
    const btn = document.getElementById('retry-btn');
    const icon = document.getElementById('retry-icon');
    const label = document.getElementById('retry-label');
    
    if (!btn || !icon || !label) return;

    btn.disabled = true;
    icon.classList.add('animate-spin');
    label.textContent = 'Verificando conexão...';
    
    setTimeout(() => {
      icon.classList.remove('animate-spin');
      btn.disabled = false;
      label.textContent = 'Tentar novamente';
    }, 1400);
  }
</script></main></body></html>
