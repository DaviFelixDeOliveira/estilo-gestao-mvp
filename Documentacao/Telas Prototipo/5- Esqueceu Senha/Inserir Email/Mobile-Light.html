<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Esqueci minha senha - Estilo e Gestão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#C92A2A',
              redHover: '#B02525',
              graphite: '#2F2F2D',
              muted: '#666662',
              lightBorder: '#E9E9E4',
              surface: '#FAF9F6',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02)',
            floating: '0 4px 16px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#F4F3EE] min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-graphite selection:bg-red-100 selection:text-brand-red">
<!-- BEGIN: MobileContainer -->
<!-- Main mobile viewport wrapper designed for iOS 390px display -->
<div class="relative w-full max-w-[420px] min-h-screen sm:min-h-[850px] sm:rounded-[36px] overflow-hidden bg-[#F4F3EE] flex flex-col justify-between shadow-2xl border border-[#EBEAE4]">
<!-- Background Barbershop Ambience Image with Soft Overlay -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-25 overflow-hidden">
<img alt="Barbershop Background" class="w-full h-full object-cover object-center filter blur-[1px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcU-gXNOwfcLtNZVMD6LsneD3_Nk6Sxtxm4CUhMBTxW3aBC4qrg0Kwjbm_3kOoJgLt7uSf_UDAtxvcgp0PHmQAjNjLjZHi4foyBzZzsviTT_TK2Cvnl7GcaxFbecwF8yln8WNl82t8xoLEPEb4lqAvsCYVDjHatmvyt-lGi8qiewQolOJnb2NQKVaTAm-P4YRo9NcEltPQesBmUWi2JvZM0TbYAOxJ5RRTXoE1Fl9waEUpOGQqxbLTzWy-CePmNUSgrM8"/>
<div class="absolute inset-0 bg-gradient-to-b from-[#F4F3EE]/95 via-[#F4F3EE]/85 to-[#F4F3EE]/98"></div>
</div>
<!-- BEGIN: TopBar -->
<header class="relative z-10 pt-7 px-5 pb-3 flex items-center justify-between" data-purpose="mobile-top-bar">
<!-- Back Button -->
<button aria-label="Voltar" class="w-10 h-10 rounded-full bg-white/90 border border-black/5 shadow-sm flex items-center justify-center text-brand-graphite active:scale-95 transition-transform" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Title -->
<h1 class="text-xs font-bold tracking-[0.22em] text-brand-graphite uppercase">
        ESTILO E GESTÃO
      </h1>
<!-- Dark Mode / Theme Toggle -->
<button aria-label="Alternar tema" class="w-10 h-10 rounded-full bg-white/90 border border-black/5 shadow-sm flex items-center justify-center text-brand-graphite active:scale-95 transition-transform" type="button">
<svg class="h-4 w-4 stroke-brand-graphite" fill="none" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="relative z-10 flex-1 px-4 sm:px-6 pt-3 pb-6 flex flex-col justify-center">
<!-- Logo Floating Box -->
<div class="flex justify-center mb-3.5">
<div class="w-[84px] h-[84px] rounded-2xl bg-white/95 backdrop-blur-md shadow-floating border border-white flex items-center justify-center p-3">
<img alt="Estilo e Gestão" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKU2j6DHfHwqS_skYsVRyAQhfvI4Xd7C77ne5x0wkrNC12LIqDUo8BJUmkFTu1M2Hk4sB9Kh92nNWtEQaPjB3i_hHrkSynzcLPliq0fcGU5MJKXqt6ik-VVuJJxZF20gb529oey44Zwiz4bsDbt-tBsCQ0Q-2v4bp6ELtIiZuxKD2H-8ZbsaNppjLj_0HlMIEdjRDPPpAVU11KNJcCzPsOuiUP_gznJKTBfrmlXEfLq1MLVPmoZ15MRbA0qcHs4dkdA44"/>
</div>
</div>
<!-- Pill Badge -->
<div class="flex justify-center mb-5">
<div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-white/80 backdrop-blur-sm border border-black/5 shadow-sm">
<span class="w-2 h-2 rounded-full bg-brand-red"></span>
<span class="text-[10px] font-bold tracking-[0.14em] text-[#4A4A46] uppercase">RECUPERAÇÃO DE ACESSO</span>
</div>
</div>
<!-- Main Card Container -->
<section class="bg-white rounded-[28px] p-6 sm:p-7 shadow-card border border-black/[0.03]">
<!-- Header Text Block -->
<div class="text-center mb-6">
<h2 class="text-2xl font-extrabold text-brand-graphite tracking-tight mb-2">
            Esqueci minha senha
          </h2>
<p class="text-[13px] leading-relaxed text-brand-muted max-w-[280px] mx-auto">
            Informe seu e-mail para receber um código de 6 dígitos de recuperação de acesso.
          </p>
</div>
<!-- Form Block -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Input Field -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-[#4A4A46] mb-1.5 ml-0.5" for="recovery-email">
              E-MAIL
            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-gray-400 pointer-events-none flex items-center">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-[#FAF9F7] text-sm text-brand-graphite placeholder-gray-400 pl-10 pr-4 py-3 rounded-xl border border-brand-lightBorder focus:border-brand-red focus:ring-1 focus:ring-brand-red focus:bg-white outline-none transition-all duration-200" id="recovery-email" placeholder="seuemail@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-brand-red hover:bg-brand-redHover active:scale-[0.99] text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all duration-200" type="submit">
<span>Enviar código</span>
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Back to Login Action -->
<div class="text-center pt-2">
<a class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-muted hover:text-brand-graphite transition-colors" href="#">
<svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Voltar para o login</span>
</a>
</div>
</form>
<!-- Separator Line -->
<hr class="border-t border-brand-lightBorder/80 my-5"/>
<!-- BEGIN: RecoveryStepper -->
<!-- 3-step visual progress indicator -->
<div class="bg-[#FAF9F7] border border-brand-lightBorder rounded-xl p-3 px-2 sm:px-4" data-purpose="recovery-stepper">
<div class="flex items-center justify-between">
<!-- Step 1: Active -->
<div class="flex flex-col items-center flex-1">
<div class="w-6 h-6 rounded-full bg-brand-red text-white text-[11px] font-bold flex items-center justify-center mb-1 shadow-sm">
                1
              </div>
<span class="text-[10px] font-bold text-brand-graphite text-center leading-tight">
                Código 6<br/>dígitos
              </span>
</div>
<!-- Stepper Divider 1-2 -->
<div class="w-6 sm:w-8 h-[1px] bg-gray-300 -mt-3"></div>
<!-- Step 2: Pending -->
<div class="flex flex-col items-center flex-1">
<div class="w-6 h-6 rounded-full bg-white border border-gray-300 text-gray-400 text-[11px] font-bold flex items-center justify-center mb-1">
                2
              </div>
<span class="text-[10px] font-medium text-brand-muted text-center leading-tight">
                Validação
              </span>
</div>
<!-- Stepper Divider 2-3 -->
<div class="w-6 sm:w-8 h-[1px] bg-gray-300 -mt-3"></div>
<!-- Step 3: Pending -->
<div class="flex flex-col items-center flex-1">
<div class="w-6 h-6 rounded-full bg-white border border-gray-300 text-gray-400 text-[11px] font-bold flex items-center justify-center mb-1">
                3
              </div>
<span class="text-[10px] font-medium text-brand-muted text-center leading-tight">
                Nova senha
              </span>
</div>
</div>
</div>
<!-- END: RecoveryStepper -->
</section>
<!-- END: Main Card Container -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="relative z-10 py-5 text-center px-4" data-purpose="mobile-footer">
<p class="text-[11px] font-medium text-brand-muted">
        Estilo e Gestão • Tecnologia para Barbearias
      </p>
</footer>
<!-- END: Footer -->
</div>
<!-- END: MobileContainer -->
</body></html>
