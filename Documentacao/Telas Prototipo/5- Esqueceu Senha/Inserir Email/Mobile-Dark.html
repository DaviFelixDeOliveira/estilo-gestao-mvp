<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Esqueci minha senha - Estilo e Gestão</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#DC2626',
              redHover: '#B91C1C',
              darkBg: '#0F0F11',
              cardBg: '#19191C',
              inputBg: '#1F1F23',
              borderDark: '#2E2E33',
              subtext: '#A1A1AA'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'glow-red': '0 0 20px -3px rgba(220, 38, 38, 0.45)',
            'card-dark': '0 20px 40px -15px rgba(0, 0, 0, 0.7)'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">body {
    font-family: "Inter", sans-serif;
    background-color: #0A0A0C;
    color: #F4F4F5;
    -webkit-font-smoothing: antialiased
    }
/* Background ambiance with high cinematic lighting and neon accents */
.bg-barbershop {
    background-image: linear-gradient(180deg, rgba(10, 10, 12, 0.82) 0%, rgba(10, 10, 12, 0.94) 65%, #0A0A0C 100%), url(https://lh3.googleusercontent.com/aida-public/AB6AXuA6bXQMFn4Y148bDb_hqs9OKNi5YDmvVYOCyDg90caaPt-34PWrdRJ-QqPS9fU8jrDGxHgDpjfJHZJAFCL6d6fLX-lBE_u17QWdMut32Xt1IJKa0wkkSuXJsUn_qb9zJiv-VUvLAXWJxrnfQZAiUrv2LgbSv7l-rqpLuZ3VzoMY8Ju14YPCH747L8JXjb5M8_rjWvGxRzNe5RO5ol43RyOSD0yUQ32qOYPu2p71ZbgpUIhHSSZTGTAW7w);
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat
    }</style>
</head>
<body class="min-h-screen bg-barbershop flex flex-col justify-between items-center px-4 py-6 selection:bg-red-600 selection:text-white">
<!-- BEGIN: TopBar -->
<header class="w-full max-w-sm flex items-center justify-between pt-2 pb-4">
<!-- Back to Previous Screen Button -->
<a aria-label="Voltar" class="w-10 h-10 rounded-full bg-neutral-900/80 border border-neutral-800 text-neutral-300 hover:text-white hover:border-neutral-700 flex items-center justify-center transition-all duration-200 backdrop-blur-md active:scale-95" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
<!-- Top App Brand Header -->
<span class="text-xs font-bold tracking-widest text-neutral-300 uppercase">
      ESTILO E GESTÃO
    </span>
<!-- Dark/Light Theme Toggle Button -->
<button aria-label="Alternar tema" class="w-10 h-10 rounded-full bg-neutral-900/80 border border-neutral-800 text-neutral-300 hover:text-white hover:border-neutral-700 flex items-center justify-center transition-all duration-200 backdrop-blur-md active:scale-95" type="button">
<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="w-full max-w-sm flex flex-col items-center my-auto">
<!-- Central Brand Logo Box -->
<div class="relative w-24 h-24 mb-6 rounded-2xl bg-neutral-900/90 border border-neutral-800 shadow-xl flex items-center justify-center p-3 backdrop-blur-md">
<div class="absolute -inset-0.5 bg-gradient-to-tr from-red-600/20 to-blue-600/20 rounded-2xl blur-sm -z-10"></div>
<img alt="Estilo e Gestão Logo" class="w-full h-full object-contain drop-shadow" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvghKpBv0KweKYc-LST8rDZCovnYFMuxntcTeeFJO67uNEPLaUYLAbd7Y-FF3u7fTXFEAjrQiWbFZ28t_A_TjH9q_HUtN6FjZsBe0EqnO9aMZqvbGFr1z9Pv0e8s4ZKFLzQR8Y93f37sxJtmiv-iPhhzQ-b2Nat25w0azDOmtktDAan-liAlcSxwWsQqzFJeK70Qy6emmHNPkUvClrZOWghd5FdDAnPp9nVEBeo8CGEZUvFzQKkqLZ_w"/>
</div>
<!-- Status Category Badge -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 mb-5 rounded-full bg-neutral-900/80 border border-neutral-800 shadow-sm backdrop-blur-md">
<span class="w-2 h-2 rounded-full bg-red-600 animate-pulse shadow-[0_0_8px_#dc2626]"></span>
<span class="text-[11px] font-semibold tracking-wider text-neutral-300 uppercase">RECUPERAÇÃO DE ACESSO</span>
</div>
<!-- Card Container -->
<section class="w-full bg-[#18181B]/90 backdrop-blur-xl border border-neutral-800/90 rounded-3xl p-6 sm:p-7 shadow-card-dark" data-purpose="recovery-card">
<!-- Heading Text Group -->
<div class="text-center mb-6">
<h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">
          Esqueci minha senha
        </h1>
<p class="text-sm text-neutral-400 leading-relaxed font-normal">
          Informe seu e-mail para receber um código de 6 dígitos de recuperação de acesso.
        </p>
</div>
<!-- Recovery Form -->
<form action="#" class="space-y-4" data-purpose="password-reset-form" method="POST">
<div class="space-y-1.5 text-left">
<label class="block text-xs font-bold text-neutral-300 tracking-wider uppercase" for="email">
            E-MAIL
          </label>
<div class="relative rounded-xl shadow-inner">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-500">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-4 py-3.5 bg-[#232327]/80 border border-neutral-700/80 rounded-xl text-white text-sm placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-all duration-200" id="email" name="email" placeholder="seuemail@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-1">
<button class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold text-sm shadow-glow-red transition-all duration-200 transform active:scale-[0.98]" type="submit">
<span>Enviar código</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Back to Login Link -->
<div class="text-center pt-2">
<a class="inline-flex items-center gap-2 text-xs font-medium text-neutral-400 hover:text-white transition-colors duration-200" href="#">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Voltar para o login</span>
</a>
</div>
</form>
<!-- Stepper Component -->
<div class="mt-7 pt-5 border-t border-neutral-800/80" data-purpose="recovery-stepper">
<div class="grid grid-cols-3 gap-2 text-center">
<!-- Step 1: Active -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-red-600 text-white text-xs font-bold flex items-center justify-center mb-1.5 shadow-[0_0_8px_#dc2626]">
              1
            </div>
<span class="text-[11px] font-medium text-neutral-200 leading-tight">Código 6 dígitos</span>
</div>
<!-- Step 2: Next -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-neutral-800 border border-neutral-700 text-neutral-400 text-xs font-semibold flex items-center justify-center mb-1.5">
              2
            </div>
<span class="text-[11px] font-medium text-neutral-500 leading-tight">Validação</span>
</div>
<!-- Step 3: Final -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-neutral-800 border border-neutral-700 text-neutral-400 text-xs font-semibold flex items-center justify-center mb-1.5">
              3
            </div>
<span class="text-[11px] font-medium text-neutral-500 leading-tight">Nova senha</span>
</div>
</div>
</div>
</section>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="w-full max-w-sm text-center py-4">
<p class="text-[11px] text-neutral-500 tracking-wide">
      Estilo e Gestão • Tecnologia para Barbearias
    </p>
</footer>
<!-- END: Footer -->
</body></html>
