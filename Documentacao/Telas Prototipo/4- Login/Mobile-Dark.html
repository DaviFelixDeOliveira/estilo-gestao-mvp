<!DOCTYPE html><html class="dark bg-[#181817] stitch-anim-fade-in" lang="pt-BR" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#5f5e5c", "surface-secondary": "#E9E9E4", "surface-elevated": "#FFFFFF", "dark-bg": "#181817", "dark-surface": "#222220", "on-error-container": "#93000a", "tertiary-fixed": "#e4e2dd", "warning": "#B54708", "tertiary-container": "#2f2f2c", "dark-danger-surface": "#4A1D1A", "error": "#ba1a1a", "surface-bright": "#faf9f5", "dark-text-primary": "#F4F4F0", "on-error": "#ffffff", "surface-base": "#F4F4F0", "surface": "#faf9f5", "tertiary-fixed-dim": "#c8c6c1", "dark-primary-hover": "#E9E9E4", "interactive-hover": "#3A3A38", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#1b1c1a", "on-primary-fixed-variant": "#474745", "error-container": "#ffdad6", "inverse-primary": "#c8c6c3", "on-tertiary-fixed": "#1b1c19", "secondary-fixed-dim": "#c8c6c3", "danger-surface": "#FEECEB", "surface-container-low": "#f4f4f0", "outline-variant": "#c7c7c0", "dark-primary": "#F4F4F0", "dark-warning": "#FDB022", "dark-text-secondary": "#B8B8B2", "background": "#faf9f5", "dark-danger": "#F97066", "success": "#2F6B4F", "border-subtle": "#E9E9E4", "primary": "#1a1a19", "inverse-on-surface": "#f1f1ed", "warning-surface": "#FFF4E5", "on-primary": "#ffffff", "surface-dim": "#dadad6", "on-secondary-fixed": "#1b1c1a", "outline": "#777871", "dark-warning-surface": "#4A2C0A", "dark-surface-secondary": "#2B2B29", "dark-info-surface": "#12365A", "on-background": "#1a1c1a", "s : "16px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "metric-display": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "helper-text": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "headline-xl-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-[#181817] font-body-md text-body-md text-[#F4F4F0] min-h-screen flex flex-col antialiased"><main class="flex-1 flex flex-col relative w-full min-h-screen bg-[#181817] px-4 py-8 justify-between items-center">
  <!-- Ambient background glow elements -->
  <div class="absolute -top-12 -left-20 w-64 h-64 rounded-full bg-[#ba1a1a]/10 blur-3xl pointer-events-none transform -translate-x-6"></div>
  <div class="absolute top-28 -right-20 w-72 h-72 rounded-full bg-[#175CD3]/10 blur-3xl pointer-events-none transform translate-x-6"></div>

  <!-- Top action row with theme toggle -->
  <div class="w-full max-w-sm flex items-center justify-end z-10 pt-2">
    <button aria-label="Alternar Tema" class="w-11 h-11 min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl bg-[#222220] border border-[#3F3F3B] hover:bg-[#2B2B29] active:scale-95 transition-all text-[#FDB022] shadow-sm focus:outline-none focus:ring-2 focus:ring-[#53B1FD]" onclick="document.documentElement.classList.toggle('dark')" type="button">
      <span class="material-symbols-outlined text-[20px]">light_mode</span>
    </button>
  </div>

  <!-- Centered Logo Area -->
  <div class="w-full max-w-sm flex flex-col items-center justify-center -mt-2 mb-6 z-10">
    <div class="relative flex items-center justify-center w-32 h-24 mb-1">
      <img alt="Estilo e Gestão" class="w-32 h-24 object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-0wcQShmFmsdAKhoVb3tb3vbBqAbSyGzaCx-kAELsuID2tCMRUqXkHpXiL2e6wC6opm8-8UZg_tXeaqIoaZKohu_SZxP8x4ZTRHGK4JyOuBHDS-dxzpk3yu9YI6LiAFtAnpV5jZNvWhhHwYo0UoyHhQA6Yo8Kz8kDrOA8KOe-XdUgZ8xK9rBnOSHtm-jhgrFoqS9kV-K71WNFyEIEeQkWLbAESZUODOdUr8Ic87FhwW5eHxrd67RH8fwsfXadN5zhRZ0">
    </div>
    <span class="font-label-sm text-[11px] text-[#B8B8B2] uppercase tracking-widest font-semibold">
      BARBER WORKSPACE
    </span>
  </div>

  <!-- Main Login Card -->
  <div class="w-full max-w-sm z-10 mb-4">
    <div class="bg-[#222220] border border-[#3F3F3B] rounded-2xl p-6 shadow-xl flex flex-col">
      <!-- Lock Icon Header -->
      <div class="flex justify-center mb-3">
        <div class="w-12 h-12 rounded-xl bg-[#2B2B29] border border-[#3F3F3B] flex items-center justify-center shadow-inner">
          <span class="material-symbols-outlined text-[#53B1FD] text-[24px]">lock</span>
        </div>
      </div>

      <h1 class="font-headline-md text-[20px] text-[#F4F4F0] text-center font-bold tracking-tight">
        Entrar na sua conta
      </h1>
      <p class="font-body-sm text-[13px] text-[#B8B8B2] text-center mt-1 mb-5">
        Use seu e-mail e senha para acessar o Estilo e Gestão.
      </p>

      <div aria-live="polite" class="hidden flex-row items-center gap-2 p-3 mb-4 rounded-lg bg-[#4A1D1A] border border-[#F97066]/40 transition-all" id="errorBanner" role="alert">
        <span class="material-symbols-outlined text-[#F97066] text-[20px] flex-shrink-0">error</span>
        <span class="font-helper-text text-xs text-[#F97066] leading-tight">
          E-mail ou senha incorretos. Verifique os dados e tente novamente.
        </span>
      </div>

      <form class="flex flex-col gap-4" id="loginForm" novalidate="">
        <!-- Email Field -->
        <div class="flex flex-col gap-1.5">
          <label class="font-label-md text-xs text-[#F4F4F0] font-medium" for="emailInput">
            E-mail
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-[#B8B8B2] text-[20px] pointer-events-none">mail</span>
            <input autocomplete="email" class="w-full h-12 bg-[#181817] text-[#F4F4F0] placeholder:text-[#B8B8B2]/50 border border-[#3F3F3B] rounded-xl pl-11 pr-4 font-body-md text-sm focus:outline-none focus:border-[#53B1FD] focus:ring-1 focus:ring-[#53B1FD] transition-colors" id="emailInput" placeholder="seuemail@exemplo.com" required="" type="email">
          </div>
        </div>

        <!-- Password Field -->
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label class="font-label-md text-xs text-[#F4F4F0] font-medium" for="passwordInput">
              Senha
            </label>
            <a class="font-label-sm text-xs text-[#53B1FD] hover:underline focus:outline-none focus:ring-1 focus:ring-[#53B1FD] rounded py-1 min-h-[36px] flex items-center" href="#forgot-password" id="forgotPasswordLink">
              Esqueci minha senha
            </a>
          </div>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3.5 text-[#B8B8B2] text-[20px] pointer-events-none">vpn_key</span>
            <input autocomplete="current-password" class="w-full h-12 bg-[#181817] text-[#F4F4F0] placeholder:text-[#B8B8B2]/50 border border-[#3F3F3B] rounded-xl pl-11 pr-12 font-body-md text-sm focus:outline-none focus:border-[#53B1FD] focus:ring-1 focus:ring-[#53B1FD] transition-colors" id="passwordInput" placeholder="••••••••" required="" type="password">
            <button aria-label="Exibir senha" class="absolute right-0 top-0 h-12 w-12 min-h-[44px] min-w-[44px] flex items-center justify-center text-[#B8B8B2] hover:text-[#F4F4F0] active:scale-95 transition-colors focus:outline-none" id="togglePasswordBtn" type="button">
              <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
            </button>
          </div>
        </div>

        <!-- Remember Terminal Checkbox -->
        <div class="flex items-center gap-2.5 py-1">
          <input checked="" class="w-4 h-4 rounded border-[#3F3F3B] bg-[#181817] text-[#53B1FD] focus:ring-0 focus:ring-offset-0 cursor-pointer" id="rememberMe" type="checkbox">
          <label class="font-body-sm text-xs text-[#B8B8B2] cursor-pointer select-none" for="rememberMe">
            Lembrar este terminal
          </label>
        </div>

        <!-- Submit Button -->
        <button class="w-full h-12 min-h-[44px] mt-1 bg-[#F4F4F0] text-[#181817] font-semibold py-3.5 rounded-xl hover:bg-[#E9E9E4] active:scale-[0.99] font-label-lg text-sm flex items-center justify-center gap-2 transition-all focus:outline-none focus:ring-2 focus:ring-[#53B1FD] shadow-md" id="submitBtn" type="submit">
          <span class="inline-block" id="btnLabel">Entrar</span>
          <div class="hidden flex items-center gap-2" id="btnSpinner">
            <svg class="animate-spin h-5 w-5 text-[#181817]" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
              <path class="opacity-75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" fill="currentColor"></path>
            </svg>
            <span class="font-label-lg text-sm font-semibold">Entrando...</span>
          </div>
        </button>
      </form>
    </div>

    <!-- Bottom Register Card -->
    <div class="mt-4 p-4 rounded-xl bg-[#222220] border border-[#3F3F3B] flex items-center justify-center gap-1.5 text-center text-xs shadow-sm">
      <span class="text-[#B8B8B2]">
        Ainda não possui uma conta?
      </span>
      <a class="text-[#53B1FD] font-semibold hover:underline underline-offset-4 focus:outline-none focus:ring-1 focus:ring-[#53B1FD] rounded p-1" href="#register">
        Criar conta
      </a>
    </div>
  </div>

  <!-- Footer with Shield Icon -->
  <div class="w-full max-w-sm flex items-center justify-center gap-1.5 text-center text-[#B8B8B2] text-xs z-10 pt-2 pb-2">
    <span class="material-symbols-outlined text-[16px] text-[#6FB892]">verified_user</span>
    <span class=""><br></span>
  </div>

  <script>
    (function() {
      var passwordInput = document.getElementById('passwordInput');
      var togglePasswordBtn = document.getElementById('togglePasswordBtn');
      var eyeIcon = document.getElementById('eyeIcon');
      var loginForm = document.getElementById('loginForm');
      var emailInput = document.getElementById('emailInput');
      var errorBanner = document.getElementById('errorBanner');
      var submitBtn = document.getElementById('submitBtn');
      var btnLabel = document.getElementById('btnLabel');
      var btnSpinner = document.getElementById('btnSpinner');

      if (togglePasswordBtn && passwordInput && eyeIcon) {
        togglePasswordBtn.addEventListener('click', function() {
          var isPassword = passwordInput.getAttribute('type') === 'password';
          if (isPassword) {
            passwordInput.setAttribute('type', 'text');
            eyeIcon.textContent = 'visibility_off';
            togglePasswordBtn.setAttribute('aria-label', 'Ocultar senha');
          } else {
            passwordInput.setAttribute('type', 'password');
            eyeIcon.textContent = 'visibility';
            togglePasswordBtn.setAttribute('aria-label', 'Exibir senha');
          }
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          
          var email = emailInput.value.trim();
          var password = passwordInput.value;

          if (errorBanner) {
            errorBanner.classList.add('hidden');
            errorBanner.classList.remove('flex');
          }

          btnLabel.classList.add('hidden');
          btnSpinner.classList.remove('hidden');
          btnSpinner.classList.add('flex');
          submitBtn.disabled = true;

          setTimeout(function() {
            btnLabel.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            btnSpinner.classList.remove('flex');
            submitBtn.disabled = false;

            if (!email || !password || email.indexOf('@') === -1 || password.length < 6) {
              if (errorBanner) {
                errorBanner.classList.remove('hidden');
                errorBanner.classList.add('flex');
              }
            } else {
              submitBtn.classList.remove('bg-[#F4F4F0]', 'text-[#181817]');
              submitBtn.classList.add('bg-[#6FB892]', 'text-[#181817]');
              btnLabel.textContent = 'Autenticado com sucesso';
            }
          }, 800);
        });
      }
    })();
  </script>
</main>

</body></html>
